<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AmazMe</title>
		<!-- Canvas colour before the first paint, the two base fills of the palette
		     (`--dsw-static-neutral-bluish-00` and `-950` in tokens.css). -->
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				background-color: #fff;
			}
			/* The dark canvas, keyed off the attribute the body script sets from the stored
			   preference. A media query here would ignore a fixed light or dark choice. */
			body[data-ds-dark-theme] {
				background-color: #151517;
			}
		</style>
		<link rel="stylesheet" href="/tokens.css" />
		<link rel="stylesheet" href="/page.css" />
		<!--amazme-boot-->
	</head>
	<body>
		<!-- Palette before the first paint. DSH boots the same attribute from a body script: without it
		     the shell would paint in the light palette until the page bundle runs. The host writes the
		     stored preference into the boot manifest above; the entry re-applies it and follows later
		     appearance changes. A document without a manifest falls back to the system. -->
		<script>
			(function () {
				var preferences = (globalThis.__AMAZME_BOOT__ || {}).preferences || {};
				var preference = preferences.appearance;
				var fixed = preference === "light" || preference === "dark";
				document.body.toggleAttribute(
					"data-ds-dark-theme",
					preference === "dark" || (!fixed && matchMedia("(prefers-color-scheme: dark)").matches),
				);
				document.documentElement.style.colorScheme = fixed ? preference : "light dark";
			})();
		</script>
		<aside class="sidebar">
			<div class="logo-row">
				<span class="brand-name">AmazMe</span>
				<span class="brand-mode" id="mode"></span>
			</div>
			<!-- DSH's sidebar new-session bar (SidebarRoot .newSession): the host creates the session,
			     the page attaches it as soon as the directory carries it. -->
			<button class="new-session" type="button" id="new-session" aria-label="{{sidebar.newSession}}" disabled>
				<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
					<rect
						x="2.6"
						y="3.4"
						width="10.8"
						height="9.2"
						rx="2.6"
						fill="none"
						stroke="currentColor"
						stroke-width="1.4"
					/>
					<path d="M8 6.4v3.2M6.4 8h3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
				</svg>
				<span class="new-session-label">{{sidebar.newSession}}</span>
			</button>
			<!-- The management views. The renderer fills this from the host's panel model; the
			     settings entry sits in the footer, DSH's sidebar.footer.action slot. -->
			<nav class="sidebar-nav" id="nav" aria-label="{{sidebar.management}}"></nav>
			<p class="sidebar-label">{{sidebar.sessions}}</p>
			<input
				class="roster-filter"
				id="roster-filter"
				type="search"
				autocomplete="off"
				spellcheck="false"
				placeholder="{{sidebar.filter}}"
				aria-label="{{sidebar.filter}}"
			/>
			<div class="session-list" id="roster"><p class="empty-state">{{sidebar.waiting}}</p></div>
			<div class="sidebar-footer">
				<button class="sidebar-footer-btn" type="button" id="settings-button">
					<span class="nav-label">{{nav.settings}}</span>
				</button>
			</div>
		</aside>
		<main class="center" id="center">
			<header class="header">
				<div class="crumbs">
					<button class="crumb-back" type="button" id="view-back" aria-label="{{header.back}}" hidden>
						<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
							<path
								d="M9.6 3.6 5.2 8l4.4 4.4"
								fill="none"
								stroke="currentColor"
								stroke-width="1.6"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
					</button>
					<span class="crumb" id="session-title">{{header.noSession}}</span>
				</div>
				<div class="header-utilities">
					<!-- The session's run controls (compaction); the renderer fills this. -->
					<div class="header-actions" id="run-actions"></div>
					<span class="connection" id="connection">{{connection.starting}}</span>
					<!-- Below 1024px the sidebar column is dropped, so the management views need an
					     entry in the header; the renderer fills this card from the same nav model. -->
					<button
						class="view-menu-trigger"
						type="button"
						id="view-menu-trigger"
						aria-haspopup="menu"
						aria-expanded="false"
						aria-label="{{sidebar.management}}"
					>
						<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
							<circle cx="3.4" cy="8" r="1.2" fill="currentColor" />
							<circle cx="8" cy="8" r="1.2" fill="currentColor" />
							<circle cx="12.6" cy="8" r="1.2" fill="currentColor" />
						</svg>
					</button>
					<div class="view-menu" id="view-menu" role="menu" aria-label="{{sidebar.management}}" hidden></div>
				</div>
			</header>
			<!-- The management panel: it replaces the conversation while a view other than chat is open. -->
			<section class="view" id="view" hidden>
				<div class="view-body" id="view-body"></div>
			</section>
			<div class="transcript" id="transcript">
				<div class="column" id="column"><p class="empty-state">{{header.noSessionAttached}}</p></div>
			</div>
			<div class="composer-dock" id="composer-dock">
				<div id="queue"></div>
				<form class="composer" id="composer">
					<!-- The images attached but not sent yet; the renderer fills this. -->
					<div class="attachments" id="attachments" hidden></div>
					<textarea
						class="composer-input"
						id="prompt"
						rows="1"
						placeholder="{{composer.placeholderDetached}}"
						disabled
					></textarea>
					<div class="composer-row">
						<!-- How the next message is applied while a turn runs; the renderer fills this. -->
						<div class="submit-modes" id="submit-modes" hidden></div>
						<div class="composer-trailing">
							<!-- The attach control and its hidden picker: an image can also be pasted or dropped. -->
							<input type="file" id="file-input" accept="image/*" multiple hidden />
							<button class="composer-attach" type="button" id="attach" aria-label="{{composer.attach}}" title="{{composer.attach}}">
								<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
									<path
										d="M9.8 3.4a2.6 2.6 0 0 1 3.7 3.7l-5.3 5.3a3.9 3.9 0 0 1-5.5-5.5l5-5"
										fill="none"
										stroke="currentColor"
										stroke-width="1.4"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</button>
							<!-- The attached session's model and reasoning level (InputBar's trailing
							     ModelSelect). The renderer fills the chip and the card it opens. -->
							<button
								class="model-trigger"
								type="button"
								id="model-trigger"
								aria-haspopup="menu"
								aria-expanded="false"
								aria-label="{{model.menuAria}}"
								disabled
							>
								<span class="model-label" id="model-label">{{model.none}}</span>
								<span class="model-effort" id="model-effort" hidden></span>
								<svg class="model-chevron" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
									<path
										d="M4.2 6.4 8 10.2l3.8-3.8"
										fill="none"
										stroke="currentColor"
										stroke-width="1.5"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</button>
							<!-- The renderer swaps this Send glyph for the stop square while a turn runs. -->
							<button class="primary" type="submit" id="primary" aria-label="{{composer.send}}" disabled>
								<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
									<path
										d="M8 13.4V3.4M3.6 7.4 8 3l4.4 4.4"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</button>
							<div class="model-menu" id="model-menu" role="menu" aria-label="{{model.menuAria}}" hidden></div>
						</div>
					</div>
				</form>
			</div>
		</main>
		<!-- The one modal host: editors and prompts render here, over the main area. -->
		<div class="modal-root" id="modal-root" hidden></div>
		<script type="module" src="/page.js"></script>
	</body>
</html>

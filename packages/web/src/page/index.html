<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AmazMe</title>
		<!-- Canvas colour before the first paint, the two base fills of the palette
		     (`--dsw-static-neutral-bluish-00` and `-950` in tokens.css). -->
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				background-color: #fff;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background-color: #151517;
				}
			}
		</style>
		<link rel="stylesheet" href="/tokens.css" />
		<link rel="stylesheet" href="/page.css" />
		<!--amazme-boot-->
	</head>
	<body>
		<!-- Palette before the first paint. DSH boots the same attribute from a body script: without it
		     the shell would paint in the light palette until the page bundle runs. The entry re-applies
		     it and follows later appearance changes. -->
		<script>
			document.body.toggleAttribute("data-ds-dark-theme", matchMedia("(prefers-color-scheme: dark)").matches);
		</script>
		<aside class="sidebar">
			<div class="logo-row">
				<span class="brand-name">AmazMe</span>
				<span class="brand-mode" id="mode"></span>
			</div>
			<!-- DSH's sidebar new-session bar (SidebarRoot .newSession): the host creates the session,
			     the page attaches it as soon as the directory carries it. -->
			<button class="new-session" type="button" id="new-session" aria-label="New session" disabled>
				<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
					<rect
						x="2.6"
						y="3.4"
						width="10.8"
						height="9.2"
						rx="2.6"
						fill="none"
						stroke="currentColor"
						stroke-width="1.4"
					/>
					<path d="M8 6.4v3.2M6.4 8h3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
				</svg>
				<span class="new-session-label">New session</span>
			</button>
			<!-- The management views. The renderer fills this from the host's panel model; the
			     settings entry sits in the footer, DSH's sidebar.footer.action slot. -->
			<nav class="sidebar-nav" id="nav" aria-label="Management"></nav>
			<p class="sidebar-label">Sessions</p>
			<div class="session-list" id="roster"><p class="empty-state">Waiting for the host…</p></div>
			<div class="sidebar-footer">
				<button class="sidebar-footer-btn" type="button" id="settings-button">
					<span class="nav-label">Settings</span>
				</button>
			</div>
		</aside>
		<main class="center" id="center">
			<header class="header">
				<div class="crumbs">
					<button class="crumb-back" type="button" id="view-back" aria-label="Back to the conversation" hidden>
						<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
							<path
								d="M9.6 3.6 5.2 8l4.4 4.4"
								fill="none"
								stroke="currentColor"
								stroke-width="1.6"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
					</button>
					<span class="crumb" id="session-title">No session</span>
				</div>
				<div class="header-utilities">
					<span class="connection" id="connection">starting…</span>
					<!-- Below 1024px the sidebar column is dropped, so the management views need an
					     entry in the header; the renderer fills this card from the same nav model. -->
					<button
						class="view-menu-trigger"
						type="button"
						id="view-menu-trigger"
						aria-haspopup="menu"
						aria-expanded="false"
						aria-label="Management"
					>
						<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
							<circle cx="3.4" cy="8" r="1.2" fill="currentColor" />
							<circle cx="8" cy="8" r="1.2" fill="currentColor" />
							<circle cx="12.6" cy="8" r="1.2" fill="currentColor" />
						</svg>
					</button>
					<div class="view-menu" id="view-menu" role="menu" aria-label="Management" hidden></div>
				</div>
			</header>
			<!-- The management panel: it replaces the conversation while a view other than chat is open. -->
			<section class="view" id="view" hidden>
				<div class="view-body" id="view-body"></div>
			</section>
			<div class="transcript" id="transcript">
				<div class="column" id="column"><p class="empty-state">No session attached.</p></div>
			</div>
			<div class="composer-dock" id="composer-dock">
				<div id="queue"></div>
				<form class="composer" id="composer">
					<textarea
						class="composer-input"
						id="prompt"
						rows="1"
						placeholder="No session attached"
						disabled
					></textarea>
					<div class="composer-row">
						<div class="composer-trailing">
							<!-- The attached session's model and reasoning level (InputBar's trailing
							     ModelSelect). The renderer fills the chip and the card it opens. -->
							<button
								class="model-trigger"
								type="button"
								id="model-trigger"
								aria-haspopup="menu"
								aria-expanded="false"
								aria-label="Model and reasoning effort: No model"
								disabled
							>
								<span class="model-label" id="model-label">No model</span>
								<span class="model-effort" id="model-effort" hidden></span>
								<svg class="model-chevron" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
									<path
										d="M4.2 6.4 8 10.2l3.8-3.8"
										fill="none"
										stroke="currentColor"
										stroke-width="1.5"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</button>
							<!-- The renderer swaps this Send glyph for the stop square while a turn runs. -->
							<button class="primary" type="submit" id="primary" aria-label="Send" disabled>
								<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
									<path
										d="M8 13.4V3.4M3.6 7.4 8 3l4.4 4.4"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</button>
							<div class="model-menu" id="model-menu" role="menu" aria-label="Model and reasoning effort" hidden></div>
						</div>
					</div>
				</form>
			</div>
		</main>
		<!-- The one modal host: editors and prompts render here, over the main area. -->
		<div class="modal-root" id="modal-root" hidden></div>
		<script type="module" src="/page.js"></script>
	</body>
</html>

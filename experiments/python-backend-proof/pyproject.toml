[project]
name = "amazme-backend-proof"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn",
  "websockets",
  "httpx",
]

[dependency-groups]
dev = ["pyinstaller", "ruff"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["proof_app"]

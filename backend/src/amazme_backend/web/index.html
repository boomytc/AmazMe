<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AmazMe</title><link rel="stylesheet" href="/xterm.css"><link rel="stylesheet" href="/style.css"></head>
<body><aside><h1>AmazMe <small>0.1.0</small></h1><p id="session-workspace" class="muted">本机工作区</p><form id="model-form"><label for="model-choice">模型</label><select id="model-choice"></select><label for="model-endpoint">端点</label><input id="model-endpoint" type="url" autocomplete="off"><label for="model-proxy">代理</label><input id="model-proxy" autocomplete="off" placeholder="http://127.0.0.1:7890"><label for="model-headers">请求头</label><textarea id="model-headers" rows="3" placeholder="X-Project: demo"></textarea><p id="model-key-state" class="muted"></p><label for="model-key">密钥</label><input id="model-key" type="password" autocomplete="off"><button type="button" id="model-key-save">更换密钥</button><button type="button" id="model-key-clear">清除密钥</button><button type="submit">保存模型</button></form><details id="accounts"><summary>账号</summary><pre id="account-list"></pre><form id="oauth-form"><label for="oauth-provider">登录供应商</label><select id="oauth-provider"><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option><option value="openai-codex">OpenAI Codex</option><option value="github-copilot">GitHub Copilot</option><option value="openrouter">OpenRouter</option><option value="kimi-coding">Kimi Code</option><option value="xai">xAI</option><option value="meta">Meta</option></select><label for="oauth-method">登录方式</label><select id="oauth-method"></select><button>开始或查看登录</button><button id="oauth-cancel" type="button">取消登录</button></form><a id="oauth-url" target="_blank" rel="noopener noreferrer"></a><p id="oauth-state"></p><form id="oauth-input-form"><label for="oauth-input">回调地址或授权码</label><input id="oauth-input" type="password" autocomplete="off"><button>提交授权</button></form></details><button id="create" disabled>新建会话</button><nav id="sessions" aria-label="会话"></nav><p id="connection" role="status">未连接</p></aside>
<main><header><h2>工作区助手</h2><span id="state"></span></header>
<form id="login"><label for="token">输入本机配对码</label><input id="token" type="password" autocomplete="off" required><button>连接</button><p class="muted">在启动终端运行 pair 命令获取配对码。</p></form>
<p id="recovery" role="status" hidden></p><p id="pending-count" class="muted"></p>
<p id="compaction" hidden></p>
<form id="history-form"><label for="history-query">历史</label><input id="history-query" autocomplete="off"><button>搜索</button></form><pre id="history-results"></pre><button id="usage-load" type="button">用量</button><pre id="usage-report"></pre><button id="diagnostic-load" type="button">诊断</button><pre id="diagnostic-report"></pre>
<details id="artifacts"><summary>产物</summary><form id="artifact-form"><label for="artifact-name">名称</label><input id="artifact-name" autocomplete="off" required><label for="artifact-file">文件</label><input id="artifact-file" type="file" required><button>保存到当前会话</button></form><div id="artifact-list"></div><pre id="artifact-body"></pre></details><details id="manage"><summary>管理</summary><pre id="manage-projects"></pre><form id="manage-project"><label for="manage-project-name">项目</label><input id="manage-project-name" autocomplete="off"><button>建立项目并开会话</button></form><form id="manage-settings"><label for="manage-name">显示名</label><input id="manage-name" autocomplete="off"><button>保存设置</button></form><form id="manage-feedback"><label for="manage-feedback-text">反馈</label><input id="manage-feedback-text" autocomplete="off"><button>提交反馈</button></form><button id="manage-share" type="button">分享当前会话</button><button id="manage-export" type="button">导出</button><form id="manage-import"><label for="manage-import-text">导入</label><textarea id="manage-import-text" rows="3"></textarea><button>导入新格式</button></form><p id="manage-state"></p></details>
<details id="files"><summary>工作区文件</summary><p id="workspace-location"></p><div id="workspace-list"></div><form id="workspace-form"><label for="workspace-name">名称</label><input id="workspace-name" autocomplete="off"><label for="workspace-path">目录</label><input id="workspace-path" autocomplete="off"><button>授予目录</button></form><div id="file-list"></div><label for="file-content">文件内容</label><textarea id="file-content" rows="8"></textarea><button id="file-save" type="button">保存文件</button><button id="checkpoint-save" type="button">保存检查点</button><button id="checkpoint-preview" type="button">预览检查点</button><button id="checkpoint-restore" type="button">恢复检查点</button><pre id="file-diff"></pre></details>
<details id="terminal"><summary>终端</summary><select id="terminal-choice" aria-label="会话终端"></select><button id="terminal-new" type="button">新建终端</button><button id="terminal-close" type="button">关闭终端</button><span id="terminal-state"></span><div id="terminal-output" tabindex="0" aria-label="终端画面"></div><form id="terminal-form"><label for="terminal-input">输入</label><input id="terminal-input" autocomplete="off"><button>发送</button><button id="terminal-resize" type="button">100×40</button><button id="terminal-retry" type="button">重试原输入</button><span id="terminal-pending"></span><button id="terminal-confirm" type="button">已核对输入，继续</button></form></details>
<details id="mcp"><summary>MCP</summary><select id="mcp-server" aria-label="会话 MCP 服务"></select><span id="mcp-state"></span><form id="mcp-form"><label for="mcp-command">命令</label><input id="mcp-command" autocomplete="off"><button>连接</button></form><div id="mcp-tools"></div><pre id="mcp-schema"></pre><label for="mcp-arguments">工具参数 JSON</label><textarea id="mcp-arguments">{}</textarea><button id="mcp-request" type="button">请求调用</button><div id="mcp-approval"></div><pre id="mcp-result"></pre><button id="mcp-cancel" type="button">停止 MCP</button></details>
<details id="computer"><summary>桌面</summary><form id="computer-form"><label for="computer-enabled"><input id="computer-enabled" type="checkbox">启用桌面观察</label><button>保存</button></form><button id="computer-observe" type="button">观察</button><form id="computer-act"><label for="computer-x">横坐标</label><input id="computer-x" value="1"><label for="computer-y">纵坐标</label><input id="computer-y" value="4"><button>点击</button></form><button id="computer-cleanup" type="button">确认清理</button><p id="computer-state"></p></details>
<details id="web"><summary>网页</summary><form id="web-form"><label for="web-enabled"><input id="web-enabled" type="checkbox">启用 DeepSeek 网页</label><button>保存</button></form><form id="web-search"><label for="web-query">搜索</label><input id="web-query" autocomplete="off"><button>搜索</button></form><p id="web-state"></p></details>
<details id="workflow"><summary>工作流</summary><form id="workflow-form"><label for="workflow-check">检查</label><input id="workflow-check" autocomplete="off"><label for="workflow-limit">修正上限</label><input id="workflow-limit" type="number" min="0" max="8" value="1"><button>开始</button></form><button id="workflow-fail" type="button">记为未通过</button><button id="workflow-pass" type="button">记为通过</button><button id="workflow-resume" type="button">恢复阶段</button><button id="workflow-cancel" type="button">取消工作流</button><button id="workflow-cancel-child" type="button">取消当前子任务</button><p id="workflow-state"></p></details>
<details id="automation"><summary>定时</summary><form id="automation-form"><label for="automation-zone">时区</label><input id="automation-zone" value="America/New_York" autocomplete="off"><label for="automation-local">本地时间</label><input id="automation-local" placeholder="2026-01-15T09:00" autocomplete="off"><label for="automation-text">任务</label><input id="automation-text" autocomplete="off"><button>安排</button></form><button id="automation-tick" type="button">运行到期任务</button><p id="automation-state"></p></details>
<details id="memory"><summary>记忆</summary><form id="memory-form"><label for="memory-text">记住</label><input id="memory-text" autocomplete="off"><button>保存记忆</button></form><button id="memory-preview" type="button">查看将注入的记忆</button><pre id="memory-list"></pre></details>
<details id="plugins"><summary>插件</summary><pre id="plugin-list"></pre><form id="plugin-form"><label for="plugin-name">名称</label><input id="plugin-name" autocomplete="off"><label for="plugin-label">配置</label><input id="plugin-label" autocomplete="off"><button>登记插件</button></form><p id="plugin-state"></p><form id="plugin-call"><label for="plugin-text">记录</label><input id="plugin-text" autocomplete="off"><button>执行</button></form><button id="plugin-reload" type="button">重新加载</button><pre id="plugin-result"></pre></details>
<details id="codemode"><summary>脚本</summary><label for="code-source">脚本</label><textarea id="code-source" rows="4"></textarea><button id="code-run" type="button">运行脚本</button><button id="code-cancel" type="button">取消脚本</button><pre id="code-result"></pre><pre id="code-state"></pre></details>
<details id="remote"><summary>远端</summary><form id="remote-form"><label for="remote-host">主机</label><input id="remote-host" autocomplete="off"><label for="remote-user">用户</label><input id="remote-user" autocomplete="off"><label for="remote-port">SSH 端口</label><input id="remote-port" type="number" min="1" max="65535" placeholder="22"><label for="remote-identity">身份文件</label><input id="remote-identity" autocomplete="off"><label for="remote-config">SSH 配置文件</label><input id="remote-config" autocomplete="off"><button id="remote-scan" type="button">读取主机密钥</button><pre id="remote-keys"></pre><label for="remote-key">已核对的主机密钥行</label><input id="remote-key" autocomplete="off"><button>连接远端</button></form><p id="remote-state"></p><form id="remote-command"><label for="remote-run">命令</label><input id="remote-run" autocomplete="off"><button>发送到远端</button></form><button id="remote-drop" type="button">断开本地连接</button><button id="remote-again" type="button">重新连接</button><pre id="remote-result"></pre></details>
<div id="content"><section id="conversation" aria-label="任务记录" aria-live="polite"></section><section id="approvals" aria-label="待审批"></section><section id="effects" aria-label="未知效果核对"></section><section id="action-retries" aria-label="待确认操作"></section></div>
<details id="tool-records"><summary>工具与执行记录</summary><pre id="tools"></pre></details>
<form id="composer"><label for="prompt">任务</label><textarea id="prompt" rows="4" placeholder="描述任务；文件和命令仅作用于已授权工作区" required></textarea><div><label for="images">图片</label><input id="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><span id="image-note"></span><label for="mode">提交方式</label><select id="mode"><option value="queue">排队执行</option><option value="steer">引导当前任务</option><option value="reject_busy">忙时拒绝</option></select><button id="send" disabled>发送</button><button id="cancel" type="button" disabled>取消当前任务</button><button id="archive" type="button" disabled>归档</button></div></form><p id="error" role="alert"></p></main><script type="module" src="/app.js"></script></body></html>

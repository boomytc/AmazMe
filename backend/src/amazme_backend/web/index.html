<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AmazMe</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><h1>AmazMe <small>0.1.0</small></h1><p class="muted">Linux 工作区</p><form id="model-form"><label for="model-choice">模型</label><select id="model-choice"></select><label for="model-endpoint">端点</label><input id="model-endpoint" type="url" autocomplete="off"><label for="model-proxy">代理</label><input id="model-proxy" autocomplete="off" placeholder="http://127.0.0.1:7890"><label for="model-headers">请求头</label><textarea id="model-headers" rows="3" placeholder="X-Project: demo"></textarea><button type="submit">保存模型</button></form><button id="create" disabled>新建会话</button><nav id="sessions" aria-label="会话"></nav><p id="connection" role="status">未连接</p></aside>
<main><header><h2>工作区助手</h2><span id="state"></span></header>
<form id="login"><label for="token">输入本机配对码</label><input id="token" type="password" autocomplete="off" required><button>连接</button><p class="muted">在启动终端运行 pair 命令获取配对码。</p></form>
<p id="recovery" role="status" hidden></p><p id="pending-count" class="muted"></p>
<p id="compaction" hidden></p>
<details id="files"><summary>工作区文件</summary><div id="file-list"></div><label for="file-content">文件内容</label><textarea id="file-content" rows="8"></textarea><button id="file-save" type="button">保存文件</button><pre id="file-diff"></pre></details>
<details id="terminal"><summary>终端</summary><pre id="terminal-output"></pre><form id="terminal-form"><label for="terminal-input">输入</label><input id="terminal-input" autocomplete="off"><button>发送</button><button id="terminal-resize" type="button">100×40</button></form></details>
<details id="mcp"><summary>MCP</summary><form id="mcp-form"><label for="mcp-command">命令</label><input id="mcp-command" autocomplete="off"><button>连接</button></form><div id="mcp-tools"></div><p id="mcp-approval"></p><pre id="mcp-result"></pre><button id="mcp-cancel" type="button">停止 MCP</button></details>
<div id="content"><section id="conversation" aria-label="任务记录" aria-live="polite"></section><section id="approvals" aria-label="待审批"></section><section id="effects" aria-label="未知效果核对"></section><section id="action-retries" aria-label="待确认操作"></section></div>
<details id="tool-records"><summary>工具与执行记录</summary><pre id="tools"></pre></details>
<form id="composer"><label for="prompt">任务</label><textarea id="prompt" rows="4" placeholder="描述任务；文件和命令仅作用于已授权工作区" required></textarea><div><label for="mode">提交方式</label><select id="mode"><option value="queue">排队执行</option><option value="steer">引导当前任务</option><option value="reject_busy">忙时拒绝</option></select><button id="send" disabled>发送</button><button id="cancel" type="button" disabled>取消当前任务</button><button id="archive" type="button" disabled>归档</button></div></form><p id="error" role="alert"></p></main><script type="module" src="/app.js"></script></body></html>

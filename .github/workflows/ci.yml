name: CI

on:
  push:
    branches: [main]
    paths: ["**", "!**/*.md", "**/CHANGELOG.md"]
  pull_request:
    paths: ["**", "!**/*.md", "**/CHANGELOG.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run build:offline
      - name: Build again from a symlinked checkout
        run: |
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/linked-checkout"
          cd "$RUNNER_TEMP/linked-checkout"
          npm run build:offline
      - run: npm run typecheck
      - run: npm run check:workspace
      - run: npm run test:engineering
      - name: Install ripgrep and fd for tool tests
        run: brew install ripgrep fd
      - run: npm test --workspace @amazme/coding-agent
      - run: npm test --workspace @amazme/web
      - run: npm test --workspace @amazme/gui
      - name: Desktop window smoke
        run: npm run test:smoke --workspace @amazme/gui

  desktop:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    env:
      NODE_VERSION: "22.23.3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run build:offline
      - name: Fetch official Node for the bundle
        run: |
          ARCH="$(uname -m)"
          curl -fsSL -o "$RUNNER_TEMP/node.tar.gz" "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-darwin-$ARCH.tar.gz"
          tar -xzf "$RUNNER_TEMP/node.tar.gz" -C "$RUNNER_TEMP"
          echo "NODE_BIN=$RUNNER_TEMP/node-v$NODE_VERSION-darwin-$ARCH/bin/node" >> "$GITHUB_ENV"
      - name: Build and verify the movable app
        run: node scripts/package-desktop.mjs --node "$NODE_BIN" --out "$RUNNER_TEMP/AmazMe.app" --verify
      - uses: actions/upload-artifact@v4
        with:
          name: AmazMe-macos-preview
          path: ${{ runner.temp }}/AmazMe.app
          if-no-files-found: error

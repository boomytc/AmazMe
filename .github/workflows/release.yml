name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    environment: release
    env:
      NODE_VERSION: "22.23.3"
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
          cache: npm
      - name: Check tag matches the package version
        run: |
          VERSION="$(node -p "require('./packages/gui/package.json').version")"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match v$VERSION"; exit 1; }
      - run: npm ci
      - run: npm run build:offline
      - name: Fetch official Node for the bundle
        run: |
          ARCH="$(uname -m)"
          curl -fsSL -o "$RUNNER_TEMP/node.tar.gz" "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-darwin-$ARCH.tar.gz"
          tar -xzf "$RUNNER_TEMP/node.tar.gz" -C "$RUNNER_TEMP"
          echo "NODE_BIN=$RUNNER_TEMP/node-v$NODE_VERSION-darwin-$ARCH/bin/node" >> "$GITHUB_ENV"
      - name: Import the Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          SIGNING_KEYCHAIN="$RUNNER_TEMP/amazme-signing.keychain-db"
          test -n "$APPLE_TEAM_ID" || { echo "APPLE_TEAM_ID repository variable is not set"; exit 1; }
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$SIGNING_KEYCHAIN" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Build, sign, and verify the DMG
        run: node scripts/package-desktop.mjs --node "$NODE_BIN" --out "$RUNNER_TEMP/AmazMe" --dmg --verify --keychain "$RUNNER_TEMP/amazme-signing.keychain-db" --team-id "$APPLE_TEAM_ID"
      - name: Notarize and staple the DMG
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc-api-key.p8"
          node scripts/notarize-macos.mjs --dmg "$(ls "$RUNNER_TEMP"/AmazMe/*.dmg)" --key "$RUNNER_TEMP/asc-api-key.p8" --team-id "$APPLE_TEAM_ID"
          rm -f "$RUNNER_TEMP/asc-api-key.p8"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/amazme-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/asc-api-key.p8"
      - name: Write release notes
        run: |
          VERSION="$(node -p "require('./packages/gui/package.json').version")"
          DMG="AmazMe-$VERSION-macos-$(uname -m).dmg"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## 安装

          1. 打开 DMG，把 AmazMe 拖到“应用程序”。
          2. 应用已用 Developer ID 签名并通过 Apple 公证，双击即可打开。
          3. 不需要安装 Node 或任何开发环境；运行时已包含在应用内。

          ## 校验

          \`\`\`bash
          shasum -a 256 -c $DMG.sha256
          \`\`\`

          ## 已知限制

          - 仅 macOS arm64。
          - 签名安装支持每天检查更新；下载与安装重启分别确认，可取消或稍后安装。
          - 更新前请完成运行中的工作。安装器保留旧应用；二进制回滚不等于数据迁移回滚。

          ## 部署方式

          - Web 界面在本机或内网自托管，不提供公网托管。
          EOF
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="$(ls "$RUNNER_TEMP"/AmazMe/*.dmg)"
          CHANNEL=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then CHANNEL=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --title "AmazMe ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${CHANNEL[@]}"

  # Every release owns a manifest. GitHub's latest route still selects the stable release;
  # the preview channel resolves a specific release tag instead.
  manifest:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*.dmg.sha256' --dir "$ASSETS"
          node scripts/release-manifest.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$ASSETS" "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
